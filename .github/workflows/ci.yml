name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maven-verify:
    name: Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven reactor
        run: ./mvnw -B -ntp verify

      - name: Upload Surefire reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports-${{ github.run_id }}
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-reports-${{ github.run_id }}
          path: "**/target/site/jacoco/**"
          if-no-files-found: warn
          retention-days: 14

      - name: Upload runnable JARs
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runnable-jars-${{ github.sha }}
          path: |
            dns-server/target/dns-server-*.jar
            !dns-server/target/original-*.jar
            admin-api/target/admin-api-*.jar
          if-no-files-found: error
          retention-days: 14

  validate-configuration:
    name: Validate configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose and observability configuration
        run: ./scripts/validate-compose.sh

  build-and-scan-dns-server:
    name: Build and scan DNS server image
    needs: maven-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build DNS server image
        run: >-
          docker build --file Dockerfile
          --build-arg VCS_REF="${GITHUB_SHA}"
          --tag "dns-resolver:ci-${GITHUB_SHA}" .

      - name: Scan DNS server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dns-resolver:ci-${{ github.sha }}
          format: sarif
          output: trivy-dns-server.sarif
          exit-code: "1"
          ignore-unfixed: "true"
          severity: CRITICAL
          scanners: vuln

      - name: Upload DNS server scan to code scanning
        if: >-
          ${{ always() && hashFiles('trivy-dns-server.sarif') != '' &&
              github.actor != 'dependabot[bot]' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-dns-server.sarif
          category: trivy-dns-server

  build-and-scan-admin-api:
    name: Build and scan Admin API image
    needs: maven-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Admin API image
        run: >-
          docker build --file Dockerfile.admin-api
          --build-arg VCS_REF="${GITHUB_SHA}"
          --tag "dns-admin-api:ci-${GITHUB_SHA}" .

      - name: Scan Admin API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dns-admin-api:ci-${{ github.sha }}
          format: sarif
          output: trivy-admin-api.sarif
          exit-code: "1"
          ignore-unfixed: "true"
          severity: CRITICAL
          scanners: vuln

      - name: Upload Admin API scan to code scanning
        if: >-
          ${{ always() && hashFiles('trivy-admin-api.sarif') != '' &&
              github.actor != 'dependabot[bot]' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-admin-api.sarif
          category: trivy-admin-api
