name: Stack smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-stack-smoke:
    name: Compose stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Compose stack smoke test
        run: bash scripts/compose-smoke.sh
