name: Staging deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vMAJOR.MINOR.PATCH release tag
        required: true
        type: string
      operation:
        description: Explicit private-staging operation
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
          - bootstrap
          - initialize-fleet-metrics

permissions:
  contents: read

concurrency:
  group: dns-platform-private-staging
  cancel-in-progress: false

jobs:
  prepare-staging-tooling:
    name: Prepare trusted staging tooling
    if: github.repository == 'AishV05/DNSResolver'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      bundle_artifact_name: ${{ steps.identity.outputs.bundle_artifact_name }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_commit: ${{ steps.identity.outputs.source_commit }}
      tooling_artifact_name: ${{ steps.identity.outputs.tooling_artifact_name }}
      tooling_checksums_sha256: ${{ steps.identity.outputs.tooling_checksums_sha256 }}
      tooling_commit: ${{ steps.identity.outputs.tooling_commit }}
    env:
      OPERATION: ${{ inputs.operation }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate main-dispatched promotion identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "AishV05/DNSResolver" ]]; then
            printf 'Unexpected repository: %s\n' "${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            printf '%s\n' 'Staging must be dispatched from canonical main.' >&2
            exit 1
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'Workflow tooling commit is not a full commit identity.' >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid release tag: %s\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          case "${OPERATION}" in
            preflight|deploy|bootstrap|initialize-fleet-metrics) ;;
            *)
              printf 'Invalid staging operation: %s\n' "${OPERATION}" >&2
              exit 1
              ;;
          esac

      - name: Check out trusted staging tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: trusted-main
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create the exact trusted-main tooling handoff
        working-directory: trusted-main
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/create-staging-tooling-handoff.sh \
            "${RUNNER_TEMP}/staging-tooling"

      - name: Record the immutable trusted-main tooling identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          tooling_commit="$(git -C trusted-main rev-parse HEAD)"
          if [[ "${tooling_commit}" != "${GITHUB_SHA}" ]]; then
            printf '%s\n' 'Trusted tooling checkout differs from workflow commit.' >&2
            exit 1
          fi
          if [[ "${tooling_commit}" != "$(git -C trusted-main rev-parse refs/remotes/origin/main)" ]]; then
            printf '%s\n' 'Trusted tooling commit is no longer canonical main.' >&2
            exit 1
          fi
          if [[ "$(git -C trusted-main cat-file -t "refs/tags/${RELEASE_TAG}")" != tag ]]; then
            printf '%s\n' 'Release tag must be annotated.' >&2
            exit 1
          fi
          source_commit="$(git -C trusted-main rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if [[ ! "${source_commit}" =~ ^[a-f0-9]{40}$ ]]; then
            printf '%s\n' 'Release tag does not identify a full commit.' >&2
            exit 1
          fi
          if ! git -C trusted-main merge-base --is-ancestor \
              "${source_commit}" refs/remotes/origin/main; then
            printf '%s\n' 'Release commit is not reachable from canonical main.' >&2
            exit 1
          fi
          tooling_checksum="$(sha256sum "${RUNNER_TEMP}/staging-tooling/SHA256SUMS" | cut -d' ' -f1)"
          bundle_artifact="staging-bundle-${RELEASE_TAG}-${source_commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tooling_artifact="staging-tooling-${tooling_commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'bundle_artifact_name=%s\n' "${bundle_artifact}" >>"${GITHUB_OUTPUT}"
          printf 'release_tag=%s\n' "${RELEASE_TAG}" >>"${GITHUB_OUTPUT}"
          printf 'source_commit=%s\n' "${source_commit}" >>"${GITHUB_OUTPUT}"
          printf 'tooling_artifact_name=%s\n' "${tooling_artifact}" >>"${GITHUB_OUTPUT}"
          printf 'tooling_checksums_sha256=%s\n' "${tooling_checksum}" >>"${GITHUB_OUTPUT}"
          printf 'tooling_commit=%s\n' "${tooling_commit}" >>"${GITHUB_OUTPUT}"

      - name: Upload the verified trusted-main tooling handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.tooling_artifact_name }}
          path: ${{ runner.temp }}/staging-tooling/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  prepare-staging-bundle:
    name: Prepare verified release-data bundle
    needs: prepare-staging-tooling
    if: github.repository == 'AishV05/DNSResolver'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      EXPECTED_SOURCE_COMMIT: ${{ needs.prepare-staging-tooling.outputs.source_commit }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare-staging-tooling.outputs.release_tag }}
    steps:
      - name: Check out the trusted release-data assembler from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: trusted-assembler
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve the annotated release commit
        id: release
        working-directory: trusted-assembler
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            printf '%s\n' 'Release-data assembler differs from the workflow commit.' >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != tag ]]; then
            printf '%s\n' 'Release tag must be annotated.' >&2
            exit 1
          fi
          source_commit="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if [[ "${source_commit}" != "${EXPECTED_SOURCE_COMMIT}" ]]; then
            printf '%s\n' 'Release tag moved after trusted identity resolution.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${source_commit}" refs/remotes/origin/main; then
            printf '%s\n' 'Release commit is not reachable from canonical main.' >&2
            exit 1
          fi
          printf 'source_commit=%s\n' "${source_commit}" >>"${GITHUB_OUTPUT}"

      - name: Log in read-only to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify the immutable release and signed evidence
        working-directory: trusted-assembler
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          set -euo pipefail
          ./scripts/verify-github-release.sh \
            "${RELEASE_TAG}" \
            "${SOURCE_COMMIT}" \
            "${RUNNER_TEMP}/verified-release"

      - name: Create the digest-bound staging bundle
        working-directory: trusted-assembler
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/create-staging-deployment-bundle.sh \
            "${RUNNER_TEMP}/verified-release" \
            "${RUNNER_TEMP}/staging-deployment"

      - name: Remove preparation registry credentials
        if: always()
        shell: bash
        run: docker logout ghcr.io

      - name: Upload the verified release-data handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.prepare-staging-tooling.outputs.bundle_artifact_name }}
          path: ${{ runner.temp }}/staging-deployment/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  operate-private-staging:
    name: Operate private staging
    needs:
      - prepare-staging-tooling
      - prepare-staging-bundle
    if: github.repository == 'AishV05/DNSResolver'
    runs-on:
      group: dns-staging
      labels:
        - self-hosted
        - linux
        - x64
        - dns-staging
    timeout-minutes: 30
    environment:
      name: staging
    permissions:
      actions: read
      packages: read
    outputs:
      evidence_artifact_name: ${{ steps.operate.outputs.evidence_artifact_name }}
      evidence_checksums_sha256: ${{ steps.operate.outputs.evidence_checksums_sha256 }}
    env:
      OPERATION: ${{ inputs.operation }}
      RELEASE_TAG: ${{ needs.prepare-staging-tooling.outputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.prepare-staging-tooling.outputs.source_commit }}
      TOOLING_CHECKSUM: ${{ needs.prepare-staging-tooling.outputs.tooling_checksums_sha256 }}
      TOOLING_COMMIT: ${{ needs.prepare-staging-tooling.outputs.tooling_commit }}
    steps:
      - name: Create a fresh private operation workspace
        id: workspace
        shell: bash
        env:
          STAGING_CONFIG_FILE: ${{ vars.STAGING_CONFIG_FILE }}
          STAGING_ENVIRONMENT_MARKER: ${{ vars.STAGING_ENVIRONMENT_MARKER }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "${STAGING_ENVIRONMENT_MARKER}" != "dns-platform-private-staging-v1" ]]; then
            printf '%s\n' 'The reviewed staging environment marker is absent.' >&2
            exit 1
          fi
          if [[ "${STAGING_CONFIG_FILE}" != /* || "${STAGING_CONFIG_FILE}" == *$'\n'* ]]; then
            printf '%s\n' 'STAGING_CONFIG_FILE must be an absolute single-line path.' >&2
            exit 1
          fi
          root="$(mktemp -d "${RUNNER_TEMP}/dns-staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          chmod 700 "${root}"
          mkdir -m 700 "${root}/bundle" "${root}/tooling"
          printf 'root=%s\n' "${root}" >>"${GITHUB_OUTPUT}"
          printf 'bundle=%s\n' "${root}/bundle" >>"${GITHUB_OUTPUT}"
          printf 'config_file=%s\n' "${STAGING_CONFIG_FILE}" >>"${GITHUB_OUTPUT}"
          printf 'evidence=%s\n' "${root}/evidence" >>"${GITHUB_OUTPUT}"
          printf 'tooling=%s\n' "${root}/tooling" >>"${GITHUB_OUTPUT}"

      - name: Download the exact release-data handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-staging-tooling.outputs.bundle_artifact_name }}
          path: ${{ steps.workspace.outputs.bundle }}

      - name: Download the exact trusted-main tooling handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-staging-tooling.outputs.tooling_artifact_name }}
          path: ${{ steps.workspace.outputs.tooling }}

      - name: Verify both handoffs before executing trusted tooling
        id: handoffs
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.workspace.outputs.bundle }}
          TOOLING_DIR: ${{ steps.workspace.outputs.tooling }}
        run: |
          set -euo pipefail
          for value in "${TOOLING_CHECKSUM}"; do
            [[ "${value}" =~ ^[a-f0-9]{64}$ ]] || {
              printf '%s\n' 'A handoff checksum identity is invalid.' >&2
              exit 1
            }
          done
          for directory in "${BUNDLE_DIR}" "${TOOLING_DIR}"; do
            [[ -d "${directory}" && ! -L "${directory}" ]] || {
              printf '%s\n' 'A downloaded handoff directory is unsafe.' >&2
              exit 1
            }
            if find "${directory}" -type l -print -quit | grep -q .; then
              printf '%s\n' 'A downloaded handoff contains a symbolic link.' >&2
              exit 1
            fi
          done
          tooling_actual="$(sha256sum "${TOOLING_DIR}/SHA256SUMS" | cut -d' ' -f1)"
          [[ "${tooling_actual}" == "${TOOLING_CHECKSUM}" ]] || {
            printf '%s\n' 'Trusted-main tooling handoff checksum differs.' >&2
            exit 1
          }
          (cd "${TOOLING_DIR}" && sha256sum --check --strict SHA256SUMS)

          chmod 755 "${TOOLING_DIR}/release" "${TOOLING_DIR}/scripts"
          chmod 644 \
            "${TOOLING_DIR}/SHA256SUMS" \
            "${TOOLING_DIR}/staging-tooling-manifest.json" \
            "${TOOLING_DIR}"/release/*.json \
            "${TOOLING_DIR}/scripts/provision-policy-reader.py"
          chmod 755 \
            "${TOOLING_DIR}/scripts/create-staging-operation-evidence.py" \
            "${TOOLING_DIR}/scripts/provision-fleet-metrics-reader.py" \
            "${TOOLING_DIR}/scripts/provision-resolver-agent.py" \
            "${TOOLING_DIR}/scripts/staging-backup.sh" \
            "${TOOLING_DIR}/scripts/staging-common.sh" \
            "${TOOLING_DIR}/scripts/staging-deploy.sh" \
            "${TOOLING_DIR}/scripts/staging-preflight.sh" \
            "${TOOLING_DIR}/scripts/staging-smoke.py" \
            "${TOOLING_DIR}/scripts/validate-json-schema.py" \
            "${TOOLING_DIR}/scripts/verify-staging-compose-config.py" \
            "${TOOLING_DIR}/scripts/verify-staging-deployment-bundle.sh" \
            "${TOOLING_DIR}/scripts/verify-staging-operation-evidence.py" \
            "${TOOLING_DIR}/scripts/verify-staging-tooling-handoff.sh"

          "${TOOLING_DIR}/scripts/verify-staging-tooling-handoff.sh" \
            "${TOOLING_DIR}"
          "${TOOLING_DIR}/scripts/verify-staging-deployment-bundle.sh" \
            "${BUNDLE_DIR}"
          bundle_actual="$(sha256sum "${BUNDLE_DIR}/SHA256SUMS" | cut -d' ' -f1)"
          printf 'bundle_checksum=%s\n' "${bundle_actual}" >>"${GITHUB_OUTPUT}"

          python3 - \
            "${TOOLING_DIR}/staging-tooling-manifest.json" \
            "${BUNDLE_DIR}/staging-deployment-manifest.json" \
            "${TOOLING_COMMIT}" "${RELEASE_TAG}" "${SOURCE_COMMIT}" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit(f"duplicate JSON field: {key}")
                  value[key] = item
              return value

          tooling = json.loads(
              Path(sys.argv[1]).read_text(encoding="utf-8"),
              object_pairs_hook=unique,
          )
          deployment = json.loads(
              Path(sys.argv[2]).read_text(encoding="utf-8"),
              object_pairs_hook=unique,
          )
          tooling_commit, tag, source_commit = sys.argv[3:]
          if re.fullmatch(r"[a-f0-9]{40}", tooling_commit) is None:
              raise SystemExit("expected tooling commit is invalid")
          if tooling.get("source", {}).get("commit") != tooling_commit:
              raise SystemExit("tooling handoff identifies another commit")
          if deployment.get("tag") != tag:
              raise SystemExit("deployment handoff identifies another tag")
          if deployment.get("source", {}).get("commit") != source_commit:
              raise SystemExit("deployment handoff identifies another source commit")
          PY

      - name: Execute the explicit staging operation
        id: operate
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.workspace.outputs.bundle }}
          BUNDLE_CHECKSUM: ${{ steps.handoffs.outputs.bundle_checksum }}
          EVIDENCE_DIR: ${{ steps.workspace.outputs.evidence }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          STAGING_CONFIG_FILE: ${{ steps.workspace.outputs.config_file }}
          TOOLING_DIR: ${{ steps.workspace.outputs.tooling }}
        run: |
          set -euo pipefail
          umask 077
          docker_config="$(mktemp -d "${RUNNER_TEMP}/docker-config.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          cleanup_registry() {
            local exit_code=$?
            trap - EXIT INT TERM
            DOCKER_CONFIG="${docker_config}" docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "${docker_config}"
            unset GHCR_TOKEN GHCR_USER
            exit "${exit_code}"
          }
          trap cleanup_registry EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export DOCKER_CONFIG="${docker_config}"
          if ! printf '%s' "${GHCR_TOKEN}" \
              | docker login ghcr.io --username "${GHCR_USER}" --password-stdin; then
            unset GHCR_TOKEN GHCR_USER
            exit 1
          fi
          unset GHCR_TOKEN GHCR_USER

          case "${OPERATION}" in
            preflight)
              "${TOOLING_DIR}/scripts/staging-preflight.sh" \
                "${BUNDLE_DIR}" "${STAGING_CONFIG_FILE}" --pull
              status=preflight-passed
              ;;
            deploy)
              "${TOOLING_DIR}/scripts/staging-deploy.sh" \
                "${BUNDLE_DIR}" "${STAGING_CONFIG_FILE}"
              status=healthy
              ;;
            bootstrap)
              "${TOOLING_DIR}/scripts/staging-deploy.sh" \
                "${BUNDLE_DIR}" "${STAGING_CONFIG_FILE}" --bootstrap
              status=healthy
              ;;
            initialize-fleet-metrics)
              "${TOOLING_DIR}/scripts/staging-deploy.sh" \
                "${BUNDLE_DIR}" "${STAGING_CONFIG_FILE}" \
                --initialize-fleet-metrics
              status=healthy
              ;;
            *)
              printf 'Invalid staging operation: %s\n' "${OPERATION}" >&2
              exit 1
              ;;
          esac

          "${TOOLING_DIR}/scripts/create-staging-operation-evidence.py" \
            --bundle "${BUNDLE_DIR}" \
            --output "${EVIDENCE_DIR}" \
            --operation "${OPERATION}" \
            --status "${status}" \
            --tooling-commit "${TOOLING_COMMIT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --bundle-checksums-sha256 "${BUNDLE_CHECKSUM}"
          "${TOOLING_DIR}/scripts/verify-staging-operation-evidence.py" \
            "${EVIDENCE_DIR}"

          evidence_checksum="$(sha256sum "${EVIDENCE_DIR}/SHA256SUMS" | cut -d' ' -f1)"
          evidence_artifact="staging-operation-evidence-${RELEASE_TAG}-${OPERATION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'evidence_artifact_name=%s\n' "${evidence_artifact}" >>"${GITHUB_OUTPUT}"
          printf 'evidence_checksums_sha256=%s\n' "${evidence_checksum}" >>"${GITHUB_OUTPUT}"

      - name: Upload the verified non-secret operation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.operate.outputs.evidence_artifact_name }}
          path: ${{ steps.workspace.outputs.evidence }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Remove the private operation workspace
        if: always()
        shell: bash
        env:
          OPERATION_ROOT: ${{ steps.workspace.outputs.root }}
        run: |
          set -euo pipefail
          case "${OPERATION_ROOT}" in
            "${RUNNER_TEMP}"/dns-staging.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.*)
              rm -rf -- "${OPERATION_ROOT}"
              ;;
            *)
              printf '%s\n' 'Refusing to remove an unexpected operation path.' >&2
              exit 1
              ;;
          esac

  verify-staging-evidence:
    name: Verify staging operation evidence
    needs:
      - prepare-staging-tooling
      - prepare-staging-bundle
      - operate-private-staging
    if: github.repository == 'AishV05/DNSResolver'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Create a fresh verification workspace
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "${RUNNER_TEMP}/staging-evidence.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          mkdir -m 700 "${root}/evidence" "${root}/tooling"
          printf 'evidence=%s\n' "${root}/evidence" >>"${GITHUB_OUTPUT}"
          printf 'tooling=%s\n' "${root}/tooling" >>"${GITHUB_OUTPUT}"

      - name: Download the exact operation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.operate-private-staging.outputs.evidence_artifact_name }}
          path: ${{ steps.workspace.outputs.evidence }}

      - name: Download the exact trusted-main tooling handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare-staging-tooling.outputs.tooling_artifact_name }}
          path: ${{ steps.workspace.outputs.tooling }}

      - name: Verify the operation assertion and expected workflow identity
        shell: bash
        env:
          EVIDENCE_CHECKSUM: ${{ needs.operate-private-staging.outputs.evidence_checksums_sha256 }}
          EVIDENCE_DIR: ${{ steps.workspace.outputs.evidence }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ needs.prepare-staging-tooling.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare-staging-tooling.outputs.source_commit }}
          TOOLING_CHECKSUM: ${{ needs.prepare-staging-tooling.outputs.tooling_checksums_sha256 }}
          TOOLING_COMMIT: ${{ needs.prepare-staging-tooling.outputs.tooling_commit }}
          TOOLING_DIR: ${{ steps.workspace.outputs.tooling }}
        run: |
          set -euo pipefail
          for directory in "${EVIDENCE_DIR}" "${TOOLING_DIR}"; do
            [[ -d "${directory}" && ! -L "${directory}" ]] || {
              printf '%s\n' 'A downloaded verification directory is unsafe.' >&2
              exit 1
            }
            if find "${directory}" -type l -print -quit | grep -q .; then
              printf '%s\n' 'A downloaded verification artifact contains a symbolic link.' >&2
              exit 1
            fi
          done
          evidence_actual="$(sha256sum "${EVIDENCE_DIR}/SHA256SUMS" | cut -d' ' -f1)"
          tooling_actual="$(sha256sum "${TOOLING_DIR}/SHA256SUMS" | cut -d' ' -f1)"
          [[ "${evidence_actual}" == "${EVIDENCE_CHECKSUM}" ]] || {
            printf '%s\n' 'Operation evidence checksum differs.' >&2
            exit 1
          }
          [[ "${tooling_actual}" == "${TOOLING_CHECKSUM}" ]] || {
            printf '%s\n' 'Evidence verifier tooling checksum differs.' >&2
            exit 1
          }
          (cd "${TOOLING_DIR}" && sha256sum --check --strict SHA256SUMS)

          chmod 755 "${TOOLING_DIR}/release" "${TOOLING_DIR}/scripts"
          chmod 644 \
            "${TOOLING_DIR}/SHA256SUMS" \
            "${TOOLING_DIR}/staging-tooling-manifest.json" \
            "${TOOLING_DIR}"/release/*.json \
            "${TOOLING_DIR}/scripts/provision-policy-reader.py"
          chmod 755 \
            "${TOOLING_DIR}/scripts/create-staging-operation-evidence.py" \
            "${TOOLING_DIR}/scripts/provision-fleet-metrics-reader.py" \
            "${TOOLING_DIR}/scripts/provision-resolver-agent.py" \
            "${TOOLING_DIR}/scripts/staging-backup.sh" \
            "${TOOLING_DIR}/scripts/staging-common.sh" \
            "${TOOLING_DIR}/scripts/staging-deploy.sh" \
            "${TOOLING_DIR}/scripts/staging-preflight.sh" \
            "${TOOLING_DIR}/scripts/staging-smoke.py" \
            "${TOOLING_DIR}/scripts/validate-json-schema.py" \
            "${TOOLING_DIR}/scripts/verify-staging-compose-config.py" \
            "${TOOLING_DIR}/scripts/verify-staging-deployment-bundle.sh" \
            "${TOOLING_DIR}/scripts/verify-staging-operation-evidence.py" \
            "${TOOLING_DIR}/scripts/verify-staging-tooling-handoff.sh"
          "${TOOLING_DIR}/scripts/verify-staging-tooling-handoff.sh" \
            "${TOOLING_DIR}"
          "${TOOLING_DIR}/scripts/verify-staging-operation-evidence.py" \
            "${EVIDENCE_DIR}"
          bundle_checksum="$(sha256sum "${EVIDENCE_DIR}/bundle-SHA256SUMS" | cut -d' ' -f1)"

          python3 - \
            "${EVIDENCE_DIR}/deployment-result.json" \
            "${RELEASE_TAG}" "${SOURCE_COMMIT}" "${TOOLING_COMMIT}" \
            "${OPERATION}" "${bundle_checksum}" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" <<'PY'
          import json
          from pathlib import Path
          import sys

          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit(f"duplicate JSON field: {key}")
                  value[key] = item
              return value

          result = json.loads(
              Path(sys.argv[1]).read_text(encoding="utf-8"),
              object_pairs_hook=unique,
          )
          tag, source, tooling, operation, bundle, run_id, attempt = sys.argv[2:]
          expected_status = "preflight-passed" if operation == "preflight" else "healthy"
          expected = {
              "tag": tag,
              "sourceCommit": source,
              "toolingCommit": tooling,
              "operation": operation,
              "status": expected_status,
              "bundleChecksumsSha256": bundle,
              "workflowRunId": int(run_id),
              "workflowRunAttempt": int(attempt),
          }
          for name, value in expected.items():
              if result.get(name) != value:
                  raise SystemExit(f"operation evidence differs for {name}")
          PY

      - name: Summarize the verified staging assertion
        shell: bash
        env:
          EVIDENCE_CHECKSUM: ${{ needs.operate-private-staging.outputs.evidence_checksums_sha256 }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ needs.prepare-staging-tooling.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.prepare-staging-tooling.outputs.source_commit }}
          TOOLING_COMMIT: ${{ needs.prepare-staging-tooling.outputs.tooling_commit }}
        run: |
          set -euo pipefail
          {
            printf '### Verified private-staging operation assertion\n\n'
            printf -- '- Release: `%s` (`%s`)\n' "${RELEASE_TAG}" "${SOURCE_COMMIT}"
            printf -- '- Operation: `%s`\n' "${OPERATION}"
            printf -- '- Trusted tooling: `%s`\n' "${TOOLING_COMMIT}"
            printf -- '- Evidence SHA256SUMS digest: `%s`\n' "${EVIDENCE_CHECKSUM}"
            printf '\nThis verifies the approved host job assertion; external host and environment controls still require operator review.\n'
          } >>"${GITHUB_STEP_SUMMARY}"
