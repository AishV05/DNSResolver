spring.application.name=dns-admin-api
server.port=${DNS_ADMIN_PORT:8081}
server.address=${DNS_ADMIN_BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Runtime-report envelopes are versioned security contracts. Reject fields or
# token streams outside those contracts instead of silently ignoring them.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-trailing-tokens=true

# Required only when the identity database is empty. There are deliberately no
# defaults: a new admin API fails closed until a bootstrap administrator exists.
dns.admin.bootstrap.username=${DNS_ADMIN_BOOTSTRAP_USERNAME:}
dns.admin.bootstrap.token=${DNS_ADMIN_BOOTSTRAP_TOKEN:}

# A resolver report is fresh at this exact boundary and stale only after it.
# The default is four times the normal thirty-second report interval.
dns.admin.fleet.report-freshness-millis=${DNS_ADMIN_FLEET_REPORT_FRESHNESS_MILLIS:120000}

# Detailed superseded sessions are retention-limited. The compact boot-fence
# ledger remains permanent so pruning cannot allow an old process to return.
dns.admin.fleet.session-retention.enabled=${DNS_ADMIN_FLEET_SESSION_RETENTION_ENABLED:true}
dns.admin.fleet.session-retention.retention-millis=${DNS_ADMIN_FLEET_SESSION_RETENTION_MILLIS:2592000000}
dns.admin.fleet.session-retention.cleanup-interval-millis=${DNS_ADMIN_FLEET_SESSION_CLEANUP_INTERVAL_MILLIS:3600000}
dns.admin.fleet.session-retention.cleanup-batch-size=${DNS_ADMIN_FLEET_SESSION_CLEANUP_BATCH_SIZE:500}
dns.admin.fleet.session-retention.cleanup-max-batches-per-run=${DNS_ADMIN_FLEET_SESSION_CLEANUP_MAX_BATCHES_PER_RUN:10}

spring.datasource.url=${DNS_ADMIN_DB_URL:jdbc:h2:file:./data/dns-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DNS_ADMIN_DB_USERNAME:sa}
spring.datasource.password=${DNS_ADMIN_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DNS_ADMIN_DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false

info.app.name=DNS Resolver Admin API
info.app.version=${DNS_PLATFORM_VERSION:@project.version@}
