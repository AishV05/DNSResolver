spring.application.name=dns-admin-api
server.port=${DNS_ADMIN_PORT:8081}
server.address=${DNS_ADMIN_BIND_ADDRESS:127.0.0.1}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Required only when the identity database is empty. There are deliberately no
# defaults: a new admin API fails closed until a bootstrap administrator exists.
dns.admin.bootstrap.username=${DNS_ADMIN_BOOTSTRAP_USERNAME:}
dns.admin.bootstrap.token=${DNS_ADMIN_BOOTSTRAP_TOKEN:}

spring.datasource.url=${DNS_ADMIN_DB_URL:jdbc:h2:file:./data/dns-admin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DNS_ADMIN_DB_USERNAME:sa}
spring.datasource.password=${DNS_ADMIN_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DNS_ADMIN_DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.info.env.enabled=false

info.app.name=DNS Resolver Admin API
info.app.version=${DNS_PLATFORM_VERSION:1.0-SNAPSHOT}
