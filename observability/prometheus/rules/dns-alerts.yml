groups:
  - name: dns-resolver
    rules:
      - alert: DnsServerTargetDown
        expr: up{job="dns-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DNS server metrics target is down
          description: >-
            Prometheus has been unable to scrape dns-server metrics for at
            least two minutes. Check the DNS container, its metrics listener,
            and the observability network.

      - alert: DnsAdminApiTargetDown
        expr: up{job="admin-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Admin API fleet metrics target is down
          description: >-
            Prometheus has been unable to scrape the authenticated Admin API
            fleet metrics endpoint for at least two minutes. Check the Admin
            API, its scrape credential, and the internal observability network.

      - alert: DnsFleetUnobserved
        expr: dns_admin_fleet_policy_state{state="unobserved"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Resolver fleet has no expected members
          description: >-
            No enabled resolver registration has been present in the expected
            fleet for at least five minutes. Register or re-enable the intended
            resolver before treating policy convergence as observed.

      - alert: DnsFleetNotConverged
        expr: dns_admin_fleet_policy_state{state="not_converged"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Resolver fleet has not converged on published policy
          description: >-
            At least one expected resolver has no current fresh report, is not
            policy-ready, or disagrees with the published revision or enabled
            rule count. Inspect the fleet member-state counts before changing
            policy.

      - alert: DnsFleetSessionCleanupFailures
        expr: dns_admin_fleet_session_cleanup_consecutive_failures >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Resolver session cleanup is repeatedly failing
          description: >-
            At least three consecutive detailed-session cleanup runs have
            failed for five minutes. Replay fences remain intact, but
            superseded session history may continue growing. Inspect the
            Admin API logs and database health.

      - alert: DnsFleetSessionRetentionBacklog
        expr: dns_admin_fleet_session_cleanup_saturated == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Resolver session retention backlog is sustained
          description: >-
            Retention-eligible resolver sessions have remained after bounded
            cleanup runs for fifteen minutes. Increase cleanup capacity only
            after checking database health and session churn.

      - alert: DnsUdpListenerDown
        expr: dns_transport_listener_running{transport="udp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DNS UDP listener reports down
          description: >-
            The DNS metrics endpoint is reachable, but the UDP listener has
            reported not running for at least two minutes. Check the DNS
            server logs and the UDP port binding.

      - alert: DnsTcpListenerDown
        expr: dns_transport_listener_running{transport="tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DNS TCP listener reports down
          description: >-
            The DNS metrics endpoint is reachable, but the TCP listener has
            reported not running for at least two minutes. Check the DNS
            server logs and the TCP port binding.

      - alert: DnsResolverFailuresHigh
        expr: sum(increase(dns_resolver_failures_total[5m])) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DNS resolver failures are elevated
          description: >-
            At least five resolver failures occurred in the trailing
            five-minute window for five minutes. Check upstream reachability,
            resolver logs, and timeout settings.

      - alert: DnsAdmissionDropsHigh
        expr: sum(increase(dns_request_drops_total[5m])) / clamp_min(sum(increase(dns_requests_received_total[5m])), 1) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DNS admission drops exceed 10 percent
          description: >-
            More than 10 percent of received DNS requests have been dropped
            at admission for five minutes. Inspect the drop reason and host
            resource pressure before changing limits.

      - alert: DnsPolicyNotReady
        expr: dns_policy_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Required DNS policy has no active snapshot
          description: >-
            Policy mode is REQUIRED but no valid initial snapshot has been
            loaded for at least two minutes. DNS queries fail closed until
            authentication, control-plane reachability, and snapshot
            validation succeed.

      - alert: DnsPolicySyncStale
        expr: dns_policy_sync_stale == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DNS policy synchronization is stale
          description: >-
            The resolver is serving its last-known-good policy, but no valid
            snapshot response has arrived within the runtime-derived stale
            threshold. Check the policy endpoint, reader token, and DNS logs.

      - alert: DnsPolicySyncFailures
        expr: increase(dns_policy_sync_results_total{result="failure"}[5m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DNS policy synchronization is repeatedly failing
          description: >-
            At least three policy synchronization attempts failed in the
            trailing five-minute window for five minutes. The active
            last-known-good snapshot, if present, remains in use.

      - alert: DnsFleetReportingFenced
        expr: dns_fleet_reporting_state{state="fenced"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Resolver fleet reporting session is fenced
          description: >-
            The control plane rejected the resolver's active reporting
            session. DNS serving and last-known-good policy remain available,
            but this process will not send another runtime report until it is
            restarted with a valid resolver credential.

      - alert: DnsFleetReportingFailures
        expr: increase(dns_fleet_reporting_failures_total[5m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Resolver fleet reporting is repeatedly failing
          description: >-
            At least three session or report operations failed in the trailing
            five-minute window for five minutes. Check control-plane
            reachability and the resolver-agent credential; DNS readiness is
            intentionally unaffected.

      - alert: DnsUpstreamResponsesRejectedHigh
        expr: increase(dns_upstream_response_rejections_total[5m]) >= 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DNS upstream response rejections are elevated
          description: >-
            At least five malformed or uncorrelated upstream responses were
            rejected in the trailing five-minute window for five minutes.
            Check upstream reachability and response-correlation telemetry;
            rejected packets are not followed or cached.

      - alert: DnsCacheEvictionsHigh
        expr: sum(increase(dns_cache_evictions_total[15m])) >= 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: DNS cache eviction pressure is sustained
          description: >-
            At least one hundred bounded-cache evictions occurred in the
            trailing fifteen-minute window for ten minutes. Inspect positive
            and negative cache pressure before increasing configured limits.
