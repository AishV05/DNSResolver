global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: dns-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - dns-server:9091

  - job_name: admin-api
    metrics_path: /api/v1/internal/fleet-metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/fleet-metrics-reader-token
    static_configs:
      - targets:
          - admin-api:8081
